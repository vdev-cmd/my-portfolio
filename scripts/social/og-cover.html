<!doctype html>
<!-- Source for public/images/og-cover.png (1200x630). See README "Regenerating images". -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #0b1120;
        color: #f8fafc;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(760px 420px at 88% -8%, rgba(59, 130, 246, 0.38), transparent 70%),
          radial-gradient(560px 360px at 0% 0%, rgba(34, 211, 238, 0.16), transparent 70%);
      }
      .grid {
        position: absolute;
        inset: 0;
        opacity: 0.55;
        background-image:
          linear-gradient(#1f2a3d 1px, transparent 1px),
          linear-gradient(90deg, #1f2a3d 1px, transparent 1px);
        background-size: 60px 60px;
        -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 0%, #000 15%, transparent 78%);
        mask-image: radial-gradient(ellipse 80% 70% at 50% 0%, #000 15%, transparent 78%);
      }
      main {
        position: absolute;
        inset: 0;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .mark {
        width: 72px;
        height: 72px;
      }
      .name {
        font-size: 34px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .role {
        font:
          500 22px ui-monospace,
          'SF Mono',
          Menlo,
          monospace;
        color: #22d3ee;
        margin-top: 4px;
      }
      h1 {
        margin: 0;
        font-size: 68px;
        line-height: 1.1;
        letter-spacing: -0.025em;
        font-weight: 650;
        max-width: 980px;
      }
      h1 span {
        background: linear-gradient(100deg, #3b82f6, #22d3ee);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .foot {
        font:
          500 24px ui-monospace,
          'SF Mono',
          Menlo,
          monospace;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <main>
      <div class="brand">
        <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#2563eb" />
              <stop offset="1" stop-color="#0e7490" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="7" fill="url(#g)" />
          <g
            fill="none"
            stroke="#fff"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5.5 22.5v-13l4.5 7.5 4.5-7.5v13" />
            <path d="M17.5 9.5l4.75 13L27 9.5" />
          </g>
        </svg>
        <div>
          <div class="name">Meng Visal</div>
          <div class="role">Mobile Application Developer / Flutter Engineer</div>
        </div>
      </div>
      <h1>
        Building Enterprise Mobile Experiences. <span>Exploring the Future of Applied AI.</span>
      </h1>
      <div class="foot">Phnom Penh, Cambodia · 5+ years of Flutter · ERP &amp; POS</div>
    </main>
  </body>
</html>
