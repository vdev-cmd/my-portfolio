name: Deploy Vue to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs only get what they need (the deploy job adds the Pages permissions).
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # configure-pages reads the Pages site settings (to get the site URL), which needs pages: read.
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Provides the real site URL (project page, user page or custom domain). The build derives
      # the Vite `base`, canonical URL, Open Graph URLs, sitemap and robots.txt from it.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (type check + production build)
        run: npm run build
        env:
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload build files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
